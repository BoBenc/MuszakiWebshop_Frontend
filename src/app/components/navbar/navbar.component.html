<nav class="navbar navbar-expand-lg bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">{{name}}</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <ng-container *ngIf="menuItems.length > 0">
            <li class="nav-item" *ngFor="let menu of menuItems">
              <a class="nav-link" [routerLink]="menu.link">{{menu.text}}</a>
            </li>
        </ng-container>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" (click)="langSelectorCollapse = !langSelectorCollapse" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            {{actLang}}
          </a>
          <ul class="dropdown-menu" [ngbCollapse]="langSelectorCollapse">
            <li>
                <a class="dropdown-item" *ngFor="let lang of langItems" (click)="langChange(lang)">
                    {{lang.text}}
                </a>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
